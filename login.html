<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Thiên Đường Sách</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --secondary: #3b82f6;
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(71, 85, 105, 0.4);
            --radius: 1.25rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            position: relative;
        }

        /* Animated Background Elements */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.15), transparent 70%);
            top: -100px;
            right: -100px;
            z-index: 0;
            filter: blur(50px);
            animation: pulse 10s infinite alternate;
        }

        .bg-glow-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1), transparent 70%);
            bottom: -50px;
            left: -50px;
            z-index: 0;
            filter: blur(50px);
            animation: pulse 8s infinite alternate-reverse;
        }

        @keyframes pulse {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 0.5;
            }

            100% {
                transform: scale(1.2) translate(20px, 30px);
                opacity: 0.8;
            }
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }

        .auth-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--primary);
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2.5rem;
            justify-content: center;
        }

        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .tabs {
            display: flex;
            background: rgba(15, 23, 42, 0.5);
            padding: 0.35rem;
            border-radius: 0.75rem;
            margin-bottom: 2rem;
        }

        .tab {
            flex: 1;
            padding: 0.75rem;
            text-align: center;
            cursor: pointer;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--primary);
            color: #1e293b;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.8);
            border-radius: 0.75rem;
            padding: 0.85rem 1rem;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: rgba(51, 65, 85, 0.8);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1);
        }

        .btn-toggle-pwd {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0.25rem;
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 0.75rem;
            color: #1e293b;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
            box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.2);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -3px rgba(245, 158, 11, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .footer-links {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .back-home:hover {
            color: #fff;
        }

        /* Form Transition States */
        #register-form {
            display: none;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: none;
            text-align: center;
        }

        /* Toast Notification */
        #toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #fff;
            color: #0f172a;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease-out;
            font-weight: 600;
            border-left: 4px solid var(--primary);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <a href="/" class="logo">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            </svg>
            <span>Thiên Đường Sách</span>
        </a>

        <div class="auth-card">
            <div class="tabs">
                <div class="tab active" id="tab-login" onclick="toggleTab('login')">Đăng nhập</div>
                <div class="tab" id="tab-register" onclick="toggleTab('register')">Tạo tài khoản</div>
            </div>

            <div id="error-box" class="error-msg"></div>

            <!-- Login Form -->
            <div id="login-section">
                <div class="header">
                    <h1>Chào mừng trở lại</h1>
                    <p>Khám phá kho sách tuyệt vời cùng chúng tôi</p>
                </div>
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email tài khoản</label>
                        <div class="input-wrapper">
                            <input type="email" id="login-email" required placeholder="name@email.com">
                        </div>
                    </div>
                    <div class="form-group">
                        <label style="display:flex; justify-content:space-between;">
                            Mật khẩu
                            <a href="#"
                                style="color:var(--primary); font-weight:500; font-size:0.75rem; text-decoration:none;">Quên
                                mật khẩu?</a>
                        </label>
                        <div class="input-wrapper">
                            <input type="password" id="login-password" required placeholder="••••••••">
                            <button type="button" class="btn-toggle-pwd" onclick="togglePwd('login-password')">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit" id="login-btn">Đăng nhập</button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-section" style="display:none;">
                <div class="header">
                    <h1>Tạo tài khoản</h1>
                    <p>Bắt đầu hành trình đọc sách ngay hôm nay</p>
                </div>
                <form id="register-form-el" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Họ và tên</label>
                        <div class="input-wrapper">
                            <input type="text" id="reg-name" required placeholder="Nguyễn Văn A">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <div class="input-wrapper">
                            <input type="email" id="reg-email" required placeholder="name@email.com">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <div class="input-wrapper">
                            <input type="password" id="reg-password" required placeholder="Ít nhất 6 ký tự">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Xác nhận mật khẩu</label>
                        <div class="input-wrapper">
                            <input type="password" id="reg-confirm" required placeholder="••••••••">
                        </div>
                    </div>
                    <button type="submit" class="btn-submit" id="reg-btn">Đăng ký ngay</button>
                </form>
            </div>
        </div>

        <a href="/" class="back-home">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Quay về trang chủ
        </a>
    </div>

    <div id="toast"></div>

    <script>
        const API = '';

        function toggleTab(type) {
            const isLogin = type === 'login';
            document.getElementById('tab-login').className = 'tab ' + (isLogin ? 'active' : '');
            document.getElementById('tab-register').className = 'tab ' + (!isLogin ? 'active' : '');

            document.getElementById('login-section').style.display = isLogin ? 'block' : 'none';
            document.getElementById('register-section').style.display = isLogin ? 'none' : 'block';

            document.getElementById('error-box').style.display = 'none';
        }

        function togglePwd(id) {
            const input = document.getElementById(id);
            const btn = input.parentElement.querySelector('.btn-toggle-pwd');
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
            } else {
                input.type = 'password';
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            const errBox = document.getElementById('error-box');

            btn.disabled = true;
            btn.textContent = 'Đang xác thực...';
            errBox.style.display = 'none';

            try {
                const res = await fetch(`${API}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('currentUser', JSON.stringify(data.user));

                    showToast('Đăng nhập thành công! 🎉');

                    // Điều hướng dựa trên role
                    setTimeout(() => {
                        if (data.user.role === 'ADMIN') window.location.href = '/admin.html';
                        else if (data.user.role === 'STAFF') window.location.href = '/staff.html';
                        else if (data.user.role === 'SHIPPER') window.location.href = '/shipper.html';
                        else window.location.href = '/';
                    }, 1000);
                } else {
                    errBox.textContent = data.message || 'Email hoặc mật khẩu không đúng';
                    errBox.style.display = 'block';
                }
            } catch (err) {
                errBox.textContent = 'Lỗi kết nối máy chủ';
                errBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Đăng nhập';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;
            const btn = document.getElementById('reg-btn');
            const errBox = document.getElementById('error-box');

            if (password.length < 6) {
                errBox.textContent = 'Mật khẩu phải có ít nhất 6 ký tự';
                errBox.style.display = 'block';
                return;
            }

            if (password !== confirm) {
                errBox.textContent = 'Mật khẩu xác nhận không khớp';
                errBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Đang khởi tạo...';
            errBox.style.display = 'none';

            try {
                const res = await fetch(`${API}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, password })
                });
                const data = await res.json();

                if (data.success) {
                    showToast('Đăng ký thành công! Hãy đăng nhập ngay.');
                    setTimeout(() => toggleTab('login'), 2000);
                } else {
                    errBox.textContent = data.message || 'Đăng ký thất bại';
                    errBox.style.display = 'block';
                }
            } catch (err) {
                errBox.textContent = 'Lỗi kết nối máy chủ';
                errBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Đăng ký ngay';
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        // Auto toggle tab if hash is #register
        if (window.location.hash === '#register') toggleTab('register');
    </script>

</body>

</html>
